<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>점 잇기 상자 따기</title>
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1c2a3a; color:#fff; touch-action:none;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; border-radius:8px; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:13%; z-index:5; display:flex; gap:10px; align-items:center; justify-content:center; padding:0 12px; background:linear-gradient(0deg,rgba(8,14,24,.95),rgba(8,14,24,.5)); border-radius:0 0 8px 8px; }
  #bar.hidden { display:none; }
  #bar button { flex:1; max-width:150px; height:70%; border-radius:14px; font-size:15px; font-weight:900; color:#fff; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.3); cursor:pointer; }
  #bar button:disabled { opacity:.35; }
  #top { position:absolute; right:6px; top:6px; display:flex; gap:6px; z-index:7; }
  #top button { position:relative; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); color:#fff; width:32px; height:32px; border-radius:8px; font-size:14px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-6px -3px; }
  #overlay { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(14,22,34,.92); border-radius:8px; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:36px; font-weight:900; color:#7fd0ff; text-shadow:0 3px 0 #0b3a5a; line-height:1.15; }
  #overlay h2 { font-size:28px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:30px; letter-spacing:3px; }
  #overlay .help { font-size:12px; color:#b8c7d8; line-height:1.7; }
  #overlay .note { font-size:11px; color:#9fb0c4; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#bfe8ff,#3fa6e8); color:#04283f; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 30px; box-shadow:0 4px 0 #1b6a9a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #1b6a9a; }
  #overlay button.sub { background:rgba(255,255,255,.14); color:#fff; box-shadow:none; font-size:14px; padding:9px 22px; border:2px solid rgba(255,255,255,.3); }
  #overlay .lv { display:flex; gap:8px; margin-top:6px; }
  #overlay .lv button { margin-top:0; padding:10px 16px; font-size:16px; }
  #overlay .lv small { display:block; font-size:10px; font-weight:600; opacity:.8; margin-top:2px; }
  #overlay .sizes { display:flex; gap:8px; margin-top:4px; }
  #overlay .size { padding:6px 14px; border-radius:999px; font-size:13px; font-weight:800; background:rgba(255,255,255,.12); border:2px solid transparent; cursor:pointer; }
  #overlay .size.on { background:rgba(63,166,232,.35); border-color:#7fd0ff; }
  .pc { display:inline; } .touch { display:none; }
  @media (pointer:coarse) { .pc { display:none; } .touch { display:inline; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="360" height="640"></canvas>
    <div id="top"><button id="muteBtn" title="소리 (M)">🔊</button></div>
    <div id="bar" class="hidden"><button id="btnUndo">↶ 무르기</button><button id="btnMenu">새 게임</button></div>
    <div id="overlay"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
